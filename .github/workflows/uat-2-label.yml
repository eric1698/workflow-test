name: UAT Label 部署

# 用「加 Label」觸發部署到 UAT（無留言、無 email 版本）
# 操作：在想部署的 PR 點選 `deploy-uat` 標籤即可。
# 回饋：部署完成後自動移除標籤（代表已處理，可再點一次重新部署）；
#       成功/失敗直接看 Actions run 的綠勾/紅叉，不產生任何留言、不寄 email。

on:
  pull_request:
    types: [labeled]

# 共用 UAT：同一時間只部署一個分支，後到的排隊
concurrency:
  group: uat-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write   # 移除標籤需要

jobs:
  deploy-uat:
    # 只有加上 deploy-uat 這個標籤時才執行
    if: github.event.label.name == 'deploy-uat'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 該 PR 的分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 部署到 UAT
        run: |
          echo "嘗試部署分支 ${{ github.head_ref }} 到 UAT..."
          echo "❌ 模擬部署失敗（例如測試不過 / 服務啟動失敗）"
          exit 1

      - name: 移除標籤（標記已處理，可再點一次重新部署）
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'deploy-uat'
            }).catch(() => {});
