name: UAT-3 PR 留言指令

# 做法三：PR 留言指令 /deploy-uat（最靈活、可重複部署、有完整稽核紀錄）
# 原理：在 PR 的留言區打 /deploy-uat，就會把「該 PR 的分支」部署到 UAT。
#       會先檢查留言者權限（write 以上才可部署），部署完回寫留言告知目前 UAT 上是哪個分支。

on:
  issue_comment:
    types: [created]

concurrency:
  group: uat-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy-uat:
    # 只在「PR 的留言」且內容含 /deploy-uat 時觸發
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/deploy-uat')
    runs-on: ubuntu-latest
    steps:
      - name: 檢查留言者權限（write 以上才可部署）
        uses: actions/github-script@v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
              core.setFailed(`使用者 ${context.actor} 沒有部署權限（需要 write 以上）`);
            }

      - name: 取得該 PR 的分支
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.head.ref);
            core.setOutput('sha', pr.head.sha);

      - name: Checkout 該分支
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: 部署到 UAT
        run: |
          echo "✅ 部署分支 ${{ steps.pr.outputs.ref }} 到 UAT"
          # 這裡放你真正的 UAT 部署指令

      - name: 回報結果到 PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ 目前 UAT 上的是分支 \`${{ steps.pr.outputs.ref }}\`（由 @${context.actor} 部署）`
            });
